name: CI

on:
  push:
    branches: [main, feat/gestion-ubicaciones]
  pull_request:
    branches: [main, feat/gestion-ubicaciones]

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Check backend formatting
        run: npm run format:check

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wesapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: wesapp_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci_test_secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run frontend unit tests
        run: npm run test:unit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_API_URL: /api
      GENERATE_SOURCEMAP: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  e2e-critical:
    name: Critical E2E
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wesapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: wesapp_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      E2E_DB_NAME: wesapp_e2e
      E2E_PASSWORD: E2E_Local_Password_123!
      E2E_MODE: true
      JWT_SECRET: ci_e2e_secret
      REACT_APP_API_URL: http://localhost:3201/api
      E2E_BASE_URL: http://localhost:3200
      E2E_API_URL: http://localhost:3201/api
      E2E_BACKEND_HEALTH_URL: http://localhost:3201/health
      E2E_WORKERS: 1
      BROWSER: none
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E database
        working-directory: backend
        run: npm run e2e:prepare-db

      - name: Start backend
        working-directory: backend
        env:
          PORT: 3201
        run: npm start > ../backend-e2e.log 2>&1 &

      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            curl -fsS http://localhost:3201/health && exit 0
            sleep 1
          done
          cat backend-e2e.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          PORT: 3200
        run: npm start > ../frontend-e2e.log 2>&1 &

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            curl -fsS http://localhost:3200 && exit 0
            sleep 1
          done
          cat frontend-e2e.log
          exit 1

      - name: Run critical E2E
        working-directory: frontend
        run: npm run test:e2e:critical

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            backend-e2e.log
            frontend-e2e.log

  visual-responsive:
    name: Visual Responsive
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wesapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: wesapp_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      E2E_DB_NAME: wesapp_e2e
      E2E_PASSWORD: E2E_Local_Password_123!
      E2E_MODE: true
      JWT_SECRET: ci_e2e_secret
      REACT_APP_API_URL: http://localhost:3201/api
      E2E_BASE_URL: http://localhost:3200
      E2E_API_URL: http://localhost:3201/api
      E2E_BACKEND_HEALTH_URL: http://localhost:3201/health
      E2E_WORKERS: 1
      BROWSER: none
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E database
        working-directory: backend
        run: npm run e2e:prepare-db

      - name: Start backend
        working-directory: backend
        env:
          PORT: 3201
        run: npm start > ../backend-visual.log 2>&1 &

      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            curl -fsS http://localhost:3201/health && exit 0
            sleep 1
          done
          cat backend-visual.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          PORT: 3200
        run: npm start > ../frontend-visual.log 2>&1 &

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            curl -fsS http://localhost:3200 && exit 0
            sleep 1
          done
          cat frontend-visual.log
          exit 1

      - name: Run visual responsive baseline
        working-directory: frontend
        run: npm run test:e2e:visual

      - name: Upload visual artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-responsive-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            backend-visual.log
            frontend-visual.log
