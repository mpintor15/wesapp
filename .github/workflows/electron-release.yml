name: Electron Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_API_URL: /api
      GENERATE_SOURCEMAP: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron macOS packages
        run: npm run electron-pack:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wesapp-macos
          path: |
            frontend/dist/WESApp-*.dmg
            frontend/dist/WESApp-*.dmg.blockmap
            frontend/dist/WESApp-*-mac.zip
            frontend/dist/WESApp-*-mac.zip.blockmap
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_API_URL: /api
      GENERATE_SOURCEMAP: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron Windows installer
        run: npm run electron-pack:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wesapp-windows
          path: |
            frontend/dist/WESApp Setup *.exe
            frontend/dist/WESApp Setup *.exe.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
