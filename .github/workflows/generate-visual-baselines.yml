name: Generate Linux Visual Baselines

on:
  workflow_dispatch:
  push:
    branches:
      - test/visual-responsive-baseline

jobs:
  generate-linux-visual-baselines:
    name: Generate Linux Visual Baselines
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wesapp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: wesapp_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      E2E_DB_NAME: wesapp_e2e
      E2E_PASSWORD: E2E_Local_Password_123!
      E2E_MODE: true
      JWT_SECRET: ci_e2e_secret
      REACT_APP_API_URL: http://localhost:3201/api
      E2E_BASE_URL: http://localhost:3200
      E2E_API_URL: http://localhost:3201/api
      E2E_BACKEND_HEALTH_URL: http://localhost:3201/health
      E2E_WORKERS: 1
      BROWSER: none
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E database
        working-directory: backend
        run: npm run e2e:prepare-db

      - name: Start backend
        working-directory: backend
        env:
          PORT: 3201
        run: npm start > ../backend-visual-generation.log 2>&1 &

      - name: Wait for backend
        run: |
          for attempt in {1..30}; do
            curl -fsS http://localhost:3201/health && exit 0
            sleep 1
          done
          cat backend-visual-generation.log
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          PORT: 3200
        run: npm start > ../frontend-visual-generation.log 2>&1 &

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            curl -fsS http://localhost:3200 && exit 0
            sleep 1
          done
          cat frontend-visual-generation.log
          exit 1

      - name: Generate Linux visual baseline candidates
        working-directory: frontend
        run: npm run test:e2e:visual:update

      - name: Verify Linux visual baseline candidates
        run: |
          snapshot_dir="frontend/e2e/visual-responsive-baseline.spec.js-snapshots"
          expected=(
            login-mobile.png
            login-desktop.png
            manager-dashboard-mobile.png
            manager-dashboard-tablet.png
            manager-dashboard-desktop.png
            manager-inventory-mobile.png
            manager-inventory-desktop.png
            accountant-accounts-mobile.png
            accountant-accounts-desktop.png
          )
          test "$(find "$snapshot_dir" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 9
          for snapshot in "${expected[@]}"; do
            test -f "$snapshot_dir/$snapshot"
            file "$snapshot_dir/$snapshot"
            stat --printf='%n %s bytes\n' "$snapshot_dir/$snapshot"
          done

      - name: Upload Linux visual baseline candidates
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baseline-candidates
          path: frontend/e2e/visual-responsive-baseline.spec.js-snapshots
          if-no-files-found: error
